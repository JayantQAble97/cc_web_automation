name: TripStacc Web IDFC flow

run-name: "TripStacc IDFC ${{ github.event.inputs.environment || 'UAT (Matrix)' }}${{ github.event.inputs.browser && format(' [{0}]', github.event.inputs.browser) || '' }}${{ github.event.inputs.feature && format(' @{0}', github.event.inputs.feature) || '' }}"

# Cancels any older queued/in-progress run of this workflow on the same ref when a new one starts,
# so re-triggering doesn't pile up stuck queued runs behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Triggers:
#   1. schedule → daily at 3:00 AM IST, runs a matrix: UAT/Chrome + UAT/Firefox
#   2. workflow_dispatch → manual run with one specific environment / browser / feature

on:
  schedule:
    # 3:00 AM IST = 21:30 UTC (previous calendar day)
    - cron: "30 21 * * *"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [QA, UAT, PROD]
        default: UAT
      browser:
        description: "Browser"
        required: true
        type: choice
        options: [Chrome, Firefox, WebKit]
        default: Chrome
      feature:
        description: "Feature tag without @ (e.g. loginpage, Smoke, Sanity)"
        required: false
        default: ""
      update_schedule:
        description: "Schedule — check to apply the run time below as the new nightly schedule (field below is ignored if unchecked)"
        required: false
        type: boolean
        default: false
      schedule_time:
        description: "New daily run time (IST) — used only if 'Schedule' above is checked"
        required: false
        type: choice
        default: "03:00 AM"
        options:
          - "12:00 AM"
          - "12:30 AM"
          - "01:00 AM"
          - "01:30 AM"
          - "02:00 AM"
          - "02:30 AM"
          - "03:00 AM"
          - "03:30 AM"
          - "04:00 AM"
          - "04:30 AM"
          - "05:00 AM"
          - "05:30 AM"
          - "06:00 AM"
          - "06:30 AM"
          - "07:00 AM"
          - "07:30 AM"
          - "08:00 AM"
          - "08:30 AM"
          - "09:00 AM"
          - "09:30 AM"
          - "10:00 AM"
          - "10:30 AM"
          - "11:00 AM"
          - "11:30 AM"
          - "12:00 PM"
          - "12:30 PM"
          - "01:00 PM"
          - "01:30 PM"
          - "02:00 PM"
          - "02:30 PM"
          - "03:00 PM"
          - "03:30 PM"
          - "04:00 PM"
          - "04:30 PM"
          - "05:00 PM"
          - "05:30 PM"
          - "06:00 PM"
          - "06:30 PM"
          - "07:00 PM"
          - "07:30 PM"
          - "08:00 PM"
          - "08:30 PM"
          - "09:00 PM"
          - "09:30 PM"
          - "10:00 PM"
          - "10:30 PM"
          - "11:00 PM"
          - "11:30 PM"

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='{"include":[{"environment":"${{ github.event.inputs.environment }}","browser":"${{ github.event.inputs.browser }}"}]}'
          else
            MATRIX='{"include":[{"environment":"UAT","browser":"Chrome"},{"environment":"UAT","browser":"Firefox"}]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  update-schedule:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_schedule == 'true'
    runs-on: ubuntu-latest
    env:
      SCHEDULE_TIME: ${{ github.event.inputs.schedule_time }}
    steps:
      - name: Validate time and compute UTC cron
        id: cron
        run: |
          TIME=$(echo "$SCHEDULE_TIME" | xargs)

          if [[ "$TIME" =~ ^([0-9]{1,2}):([0-5][0-9])[[:space:]]*([AaPp][Mm])$ ]]; then
            HH=$((10#${BASH_REMATCH[1]}))
            MM=$((10#${BASH_REMATCH[2]}))
            AMPM=$(echo "${BASH_REMATCH[3]}" | tr '[:lower:]' '[:upper:]')
            if [ "$HH" -lt 1 ] || [ "$HH" -gt 12 ]; then
              echo "::error::Hour must be 1-12 when using AM/PM. Got: '$SCHEDULE_TIME'"
              exit 1
            fi
            if [ "$AMPM" = "AM" ]; then
              if [ "$HH" -eq 12 ]; then HH=0; fi
            else
              if [ "$HH" -ne 12 ]; then HH=$((HH + 12)); fi
            fi
          elif [[ "$TIME" =~ ^([01]?[0-9]|2[0-3]):([0-5][0-9])$ ]]; then
            HH=$((10#${BASH_REMATCH[1]}))
            MM=$((10#${BASH_REMATCH[2]}))
          else
            echo "::error::schedule_time must be HH:MM 24h (e.g. 03:00) or H:MM AM/PM (e.g. 3:00 AM). Got: '$SCHEDULE_TIME'"
            exit 1
          fi

          IST_MIN=$((HH * 60 + MM))
          UTC_MIN=$(( (IST_MIN - 330 + 1440) % 1440 ))
          UTC_HH=$((UTC_MIN / 60))
          UTC_MM=$((UTC_MIN % 60))
          CRON=$(printf '%d %d * * *' "$UTC_MM" "$UTC_HH")
          UTC_TIME=$(printf '%02d:%02d' "$UTC_HH" "$UTC_MM")

          DISPLAY_AMPM="AM"; [ "$HH" -ge 12 ] && DISPLAY_AMPM="PM"
          DISPLAY_H12=$((HH % 12)); [ "$DISPLAY_H12" -eq 0 ] && DISPLAY_H12=12
          DISPLAY_IST=$(printf '%d:%02d %s' "$DISPLAY_H12" "$MM" "$DISPLAY_AMPM")

          if [ "$IST_MIN" -lt 330 ]; then DAY_NOTE=" (previous calendar day)"; else DAY_NOTE=""; fi
          {
            echo "## 🕒 New nightly schedule: ${DISPLAY_IST} IST"
            echo ""
            echo "GitHub's default token can't push changes to workflow files, so this can't be applied automatically."
            echo "Edit \`.github/workflows/tripstacc-web-idfc.yml\` on \`main\` yourself:"
            echo ""
            echo '```yaml'
            echo "  schedule:"
            echo "    # ${DISPLAY_IST} IST = ${UTC_TIME} UTC${DAY_NOTE}"
            echo "    - cron: \"${CRON}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: set-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tripstacc-web-idfc-gh-pages
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    env:
      CI: true
      CLIENT: IDFC
      ENVIRONMENT: ${{ matrix.environment }}
      BROWSER: ${{ matrix.browser }}
      FEATURE_TAG: ${{ github.event.inputs.feature || '' }}
      EMAIL_TO: ${{ github.event_name == 'workflow_dispatch' && 'jignesh.shah@customer-capital.com' || 'dharm.vrat@customer-capital.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          case "$BROWSER" in
            Firefox) npx playwright install --with-deps firefox ;;
            WebKit)  npx playwright install --with-deps webkit ;;
            *)       npx playwright install --with-deps chrome ;;
          esac

      - name: Run Playwright tests
        id: run-tests
        continue-on-error: true
        run: |
          mkdir -p reports
          case "$BROWSER" in
            Firefox) BP="firefox" ;;
            WebKit)  BP="webkit" ;;
            *)       BP="chrome" ;;
          esac
          PROJECT_VAL="tripstacc-${BP}-${ENVIRONMENT}${FEATURE_TAG:+-${FEATURE_TAG}}"
          echo "PROJECT=$PROJECT_VAL"

          set +e
          CLIENT="$CLIENT" PROJECT="$PROJECT_VAL" npx playwright test TripStacc/tests \
            --config=playwright.config.ts --workers=1 --retries=1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Calculate test stats
        if: always()
        id: stats
        run: |
          node -e "
          const fs = require('fs');
          const reportPath = 'reports/test-results.json';
          let total = 0, passed = 0, failed = 0, skipped = 0, flaky = 0, durationMs = 0;
          const failures = [];
          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            function collect(suite) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  total++;
                  const result = test.results?.[test.results.length - 1];
                  durationMs += result?.duration || 0;
                  const testStatus = test.status;
                  if (testStatus === 'skipped') skipped++;
                  else if (testStatus === 'flaky') flaky++;
                  else if (testStatus === 'unexpected') { failed++; const msg = (result?.error?.message || 'No error').split('\n')[0].replace(/\x1B\[[0-9;]*m/g, ''); failures.push({ title: spec.title + ' › ' + test.title, msg }); }
                  else passed++;
                }
              }
              for (const child of suite.suites || []) collect(child);
            }
            for (const suite of report.suites || []) collect(suite);
          }
          const s = Math.round(durationMs / 1000);
          const duration = s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s%60) + 's';
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, 'total=' + total + '\n');
          fs.appendFileSync(out, 'passed=' + passed + '\n');
          fs.appendFileSync(out, 'failed=' + failed + '\n');
          fs.appendFileSync(out, 'skipped=' + skipped + '\n');
          fs.appendFileSync(out, 'flaky=' + flaky + '\n');
          fs.appendFileSync(out, 'duration=' + duration + '\n');
          fs.appendFileSync(out, 'status=' + (failed > 0 ? 'FAILED' : 'PASSED') + '\n');
          fs.writeFileSync('/tmp/failures.json', JSON.stringify(failures));
          "

      - name: Publish report to job summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const status = '${{ steps.stats.outputs.status }}';
          const badge = status === 'FAILED' ? '🔴' : '🟢';
          const feature = process.env.FEATURE_TAG ? ' @' + process.env.FEATURE_TAG : '';
          let md = '## ' + badge + ' TripStacc IDFC ' + process.env.ENVIRONMENT + feature + '\n\n';
          md += '| | |\n|---|---|\n';
          md += '| **Status** | ' + (status === 'FAILED' ? '❌ FAILED' : '✅ PASSED') + ' |\n';
          md += '| **Total** | ${{ steps.stats.outputs.total }} |\n';
          md += '| **Passed** | ✅ ${{ steps.stats.outputs.passed }} |\n';
          md += '| **Failed** | ' + (${{ steps.stats.outputs.failed }} > 0 ? '❌ ${{ steps.stats.outputs.failed }}' : '0') + ' |\n';
          md += '| **Skipped** | ⏭️ ${{ steps.stats.outputs.skipped }} |\n';
          md += '| **Flaky** | ⚠️ ${{ steps.stats.outputs.flaky }} |\n';
          md += '| **Duration** | ⏱️ ${{ steps.stats.outputs.duration }} |\n';
          md += '| **Browser** | ${{ env.BROWSER }} |\n';
          md += '| **Branch** | \`${{ github.ref_name }}\` |\n';
          md += '| **Commit** | \`' + '${{ github.sha }}'.substring(0, 7) + '\` |\n\n';
          const failPath = '/tmp/failures.json';
          if (fs.existsSync(failPath)) {
            const failures = JSON.parse(fs.readFileSync(failPath, 'utf8'));
            if (failures.length > 0) {
              md += '### ❌ Failed Tests\n\n| # | Test | Error |\n|---|---|---|\n';
              failures.slice(0, 20).forEach((f, i) => { md += '| ' + (i+1) + ' | ' + f.title.replace(/\|/g, '\\\|') + ' | ' + f.msg.substring(0, 120).replace(/\|/g, '\\\|') + ' |\n'; });
            } else { md += '### ✅ All tests passed\n\n'; }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripstacc-idfc-${{ env.ENVIRONMENT }}-${{ env.BROWSER }}-${{ github.run_id }}
          path: |
            playwright-report/
            reports/test-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: steps.run-tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tripstacc-idfc-failures-${{ env.ENVIRONMENT }}-${{ env.BROWSER }}-${{ github.run_id }}
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Ensure playwright-report exists
        if: always()
        run: |
          if [ ! -f "playwright-report/index.html" ]; then
            mkdir -p playwright-report
            echo "<html><body><h2>No report generated for run ${{ github.run_id }}</h2></body></html>" > playwright-report/index.html
          fi

      - name: Deploy report to GitHub Pages
        if: always() && github.event_name == 'schedule'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: tripstacc/IDFC-${{ env.ENVIRONMENT }}-${{ env.BROWSER }}/${{ github.run_id }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Set report URL
        if: always()
        id: report-url
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REPO="${{ github.repository }}"
            ORG=$(echo "$REPO" | cut -d'/' -f1)
            REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
            URL="https://${ORG}.github.io/${REPO_NAME}/tripstacc/IDFC-${{ env.ENVIRONMENT }}-${{ env.BROWSER }}/${{ github.run_id }}/"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "### 📊 [View Playwright Report]($URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "### 📊 Report not published to GitHub Pages for manual runs (only the nightly scheduled run publishes, to avoid extra GitHub Pages build triggers). Download the HTML report artifact above instead." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send email report
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: jignesh.shah@customer-capital.com
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[${{ steps.stats.outputs.status }}] TripStacc IDFC ${{ env.ENVIRONMENT }} [${{ env.BROWSER }}/Web]${{ env.FEATURE_TAG && format(' @{0}', env.FEATURE_TAG) || '' }} — Playwright Report"
          to: ${{ env.EMAIL_TO }}
          from: jignesh.shah@customer-capital.com
          html_body: |
            <div style="font-family:Arial,sans-serif;max-width:600px;margin:auto">
              <h2 style="background:${{ steps.stats.outputs.status == 'FAILED' && '#cc0000' || '#00b300' }};color:#fff;padding:12px 16px;border-radius:4px;margin:0">
                ${{ steps.stats.outputs.status == 'FAILED' && '🔴' || '🟢' }} TripStacc IDFC ${{ env.ENVIRONMENT }} [${{ env.BROWSER }}/Web]${{ env.FEATURE_TAG && format(' @{0}', env.FEATURE_TAG) || '' }}
              </h2>
              <table width="100%" cellpadding="8" cellspacing="0" style="border-collapse:collapse;border:1px solid #ddd">
                <tr><td style="background:#f5f5f5;font-weight:bold;width:140px">Status</td><td>${{ steps.stats.outputs.status == 'FAILED' && '❌ FAILED' || '✅ PASSED' }}</td></tr>
                <tr><td style="font-weight:bold">Total</td><td>${{ steps.stats.outputs.total }}</td></tr>
                <tr style="background:#f5f5f5"><td style="font-weight:bold">Passed</td><td>✅ ${{ steps.stats.outputs.passed }}</td></tr>
                <tr><td style="font-weight:bold">Failed</td><td>❌ ${{ steps.stats.outputs.failed }}</td></tr>
                <tr style="background:#f5f5f5"><td style="font-weight:bold">Skipped</td><td>⏭️ ${{ steps.stats.outputs.skipped }}</td></tr>
                <tr><td style="font-weight:bold">Flaky</td><td>⚠️ ${{ steps.stats.outputs.flaky }}</td></tr>
                <tr style="background:#f5f5f5"><td style="font-weight:bold">Duration</td><td>⏱️ ${{ steps.stats.outputs.duration }}</td></tr>
                <tr><td style="font-weight:bold">Browser</td><td>${{ env.BROWSER }}</td></tr>
                <tr style="background:#f5f5f5"><td style="font-weight:bold">Branch</td><td>${{ github.ref_name }}</td></tr>
                <tr><td style="font-weight:bold">Triggered by</td><td>${{ github.actor }}</td></tr>
              </table>
              <p style="margin-top:16px">
                ${{ steps.report-url.outputs.url != '' && format('<a href="{0}" style="background:#0066cc;color:#fff;padding:10px 18px;border-radius:4px;text-decoration:none;font-weight:bold">📊 View Playwright Report</a>&nbsp;', steps.report-url.outputs.url) || '' }}
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="background:#555;color:#fff;padding:10px 18px;border-radius:4px;text-decoration:none;font-weight:bold">🔗 View Run</a>
              </p>
            </div>

      - name: Notify MS Teams
        if: always()
        continue-on-error: true
        run: |
          STATUS="${{ steps.stats.outputs.status }}"
          EMOJI=$([[ "$STATUS" == "FAILED" ]] && echo "🔴" || echo "🟢")
          FEATURE_LABEL="${FEATURE_TAG:+ @${FEATURE_TAG}}"
          curl -s -X POST "${{ secrets.MS_TEAMS_WEBHOOK }}" -H "Content-Type: application/json" -d "{\"type\":\"message\",\"attachments\":[{\"contentType\":\"application/vnd.microsoft.card.adaptive\",\"content\":{\"\$schema\":\"http://adaptivecards.io/schemas/adaptive-card.json\",\"type\":\"AdaptiveCard\",\"version\":\"1.4\",\"body\":[{\"type\":\"TextBlock\",\"text\":\"${EMOJI} TripStacc IDFC ${ENVIRONMENT}${FEATURE_LABEL} — ${STATUS}\",\"weight\":\"Bolder\",\"size\":\"Medium\",\"wrap\":true},{\"type\":\"FactSet\",\"facts\":[{\"title\":\"Status\",\"value\":\"${STATUS}\"},{\"title\":\"Total\",\"value\":\"${{ steps.stats.outputs.total }}\"},{\"title\":\"Passed\",\"value\":\"✅ ${{ steps.stats.outputs.passed }}\"},{\"title\":\"Failed\",\"value\":\"❌ ${{ steps.stats.outputs.failed }}\"},{\"title\":\"Duration\",\"value\":\"⏱️ ${{ steps.stats.outputs.duration }}\"},{\"title\":\"Browser\",\"value\":\"${{ env.BROWSER }}\"}]}],\"actions\":[{\"type\":\"Action.OpenUrl\",\"title\":\"🔗 View Run\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}}]}"

      - name: Fail job when tests failed
        if: steps.run-tests.outputs.exit_code != '0'
        run: exit 1
